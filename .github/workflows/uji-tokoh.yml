name: Lembar uji tokoh (manual)

# Ukuran "bagus" renderer boneka: lembar pose x sudut, lembar gerak, dan laporan lapis A.
# Hanya manual supaya tidak memakan kuota Actions pada setiap push.
on:
  workflow_dispatch:
    inputs:
      ketat:
        description: "Gagalkan run bila ada temuan lapis A"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  uji-tokoh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python -m pip install -e '.[render]'
          python -m playwright install --with-deps chromium
      - name: Buat lembar uji dan laporan
        run: |
          python mesin-video/papan/uji_tokoh.py -o hasil/uji_tokoh ${{ inputs.ketat && '--ketat' || '' }}
          cat hasil/uji_tokoh/laporan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Simpan lembar uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lembar-uji-tokoh
          path: hasil/uji_tokoh/
          retention-days: 14
