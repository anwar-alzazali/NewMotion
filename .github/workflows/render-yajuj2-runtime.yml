name: Uji runtime visual NewMotion (manual)

# Workflow ini hanya berjalan saat diminta pemilik repo.
# Mode "kisah" menguji keluaran Sutradara PR #28, bukan fixture motor.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Jenis pratinjau yang dijalankan"
        required: true
        type: choice
        default: adegan
        options:
          - adegan
          - kisah
      cerita:
        description: "Cerita untuk mode kisah"
        required: true
        type: choice
        default: yajuj1
        options:
          - yajuj1
          - doa2
          - bangkrut1
          - wali1

permissions:
  contents: read

jobs:
  render-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil kode NewMotion
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pasang FFmpeg dan font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Pasang runtime NewMotion dan dependensi render
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[render]'
          python -m playwright install --with-deps chromium

      - name: Periksa runtime NewMotion
        run: |
          newmotion --version
          newmotion doctor

      - name: Render mode adegan atau kisah
        env:
          MODE: ${{ inputs.mode }}
          CERITA: ${{ inputs.cerita }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasil
          if [[ "$MODE" == "adegan" ]]; then
            newmotion render tests/data/adegan_uji_visual.json \
              -o "$GITHUB_WORKSPACE/hasil/adegan-uji-visual.mp4"
          elif [[ "$MODE" == "kisah" ]]; then
            case "$CERITA" in
              yajuj1) SUMBER="tests/data/tolok_ukur/yajuj1.json" ;;
              doa2|bangkrut1|wali1) SUMBER="tests/data/tolok_ukur_buta/$CERITA.json" ;;
              *) echo "::error::Pilihan cerita tidak dikenal"; exit 1 ;;
            esac
            test -s "$SUMBER"
            newmotion render "$SUMBER" \
              --naskah --genre kisah_islami --tanpa-suara \
              -o "$GITHUB_WORKSPACE/hasil/pr28-$CERITA.mp4"
          else
            echo "::error::Mode tidak dikenal"
            exit 1
          fi

      - name: Audit papan hasil pengarahan untuk mode kisah
        if: inputs.mode == 'kisah'
        env:
          CERITA: ${{ inputs.cerita }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          nama = os.environ["CERITA"]
          papan = Path("hasil") / f"pr28-{nama}.papan.json"
          if not papan.is_file():
              raise SystemExit(f"Papan hasil pengarahan tidak ditemukan: {papan}")
          spec = json.loads(papan.read_text(encoding="utf-8"))
          shots = spec.get("cerita", {}).get("shot", [])
          if not shots:
              raise SystemExit("Direktur tidak menghasilkan shot.")

          jenis = {
              b.get("jenis")
              for shot in shots
              for b in shot.get("benda", [])
              if isinstance(b, dict)
          }
          print(f"Cerita: {nama}; jumlah shot: {len(shots)}")
          print("Jenis benda:", ", ".join(sorted(jenis)))

          if nama == "yajuj1":
              wajib = {"ngarai", "penggali", "pemimpin"}
              hilang = wajib - jenis
              if hilang:
                  raise SystemExit(f"Subjek penting tidak diarahkan: {sorted(hilang)}")

              for nomor, shot in enumerate(shots):
                  narasi = str(shot.get("_narasi", "")).lower()
                  objek = {
                      b.get("jenis") for b in shot.get("benda", []) if isinstance(b, dict)
                  }
                  if "air" in narasi and not any(
                      kata in narasi for kata in ("berlari", "berlarian", "menyerbu")
                  ) and "arus" in objek:
                      raise SystemExit(
                          f"shot {nomor}: air generik salah dipetakan menjadi arus"
                      )
                  if any(kata in narasi for kata in ("kubur", "makam")):
                      if {"ngarai", "penggali"} & objek:
                          raise SystemExit(
                              f"shot {nomor}: konteks kubur memakai renderer dinding/penggali"
                          )
          PY

      - name: Verifikasi MP4 dan ambil frame audit
        env:
          MODE: ${{ inputs.mode }}
          CERITA: ${{ inputs.cerita }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          mode = os.environ["MODE"]
          nama = "adegan-uji-visual" if mode == "adegan" else f"pr28-{os.environ['CERITA']}"
          video = Path("hasil") / f"{nama}.mp4"
          if not video.is_file() or video.stat().st_size == 0:
              raise SystemExit(f"MP4 tidak terbentuk: {video}")
          hasil = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "format=duration,size:stream=codec_name,codec_type,width,height",
               "-of", "json", str(video)],
              check=True, capture_output=True, text=True,
          )
          metadata = json.loads(hasil.stdout)
          (video.parent / "metadata.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )
          streams = metadata.get("streams", [])
          stream = next(
              (s for s in streams if s.get("codec_type") == "video"
               and s.get("codec_name") == "h264"),
              None,
          )
          if stream is None or (stream.get("width"), stream.get("height")) != (1080, 1920):
              raise SystemExit("Video bukan H.264 vertikal 1080x1920.")
          durasi = float(metadata["format"]["duration"])
          if durasi <= 0:
              raise SystemExit("Durasi video tidak valid.")
          if mode == "adegan":
              audio = next(
                  (s for s in streams if s.get("codec_type") == "audio"
                   and s.get("codec_name") == "aac"),
                  None,
              )
              if audio is None or not 35 <= durasi <= 45:
                  raise SystemExit("Mode adegan memerlukan H.264 + AAC dan durasi 35–45 detik.")
          for detik in (0.5, 2, 4, 6, 8, 10, 12, 15, 20, 25, 30, 35):
              if detik >= durasi:
                  continue
              frame = video.parent / f"frame-{detik:g}.png"
              subprocess.run(
                  ["ffmpeg", "-y", "-loglevel", "error", "-ss", str(detik),
                   "-i", str(video), "-frames:v", "1", str(frame)],
                  check=True,
              )
          with (video.parent / "SHA256SUMS.txt").open("w") as berkas:
              subprocess.run(["sha256sum", str(video)], check=True, stdout=berkas)
          print(f"LOLOS: H.264 1080x1920, durasi {durasi:.2f} detik.")
          PY

      - name: Simpan artefak pengujian
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-uji-visual-newmotion-${{ inputs.mode }}-${{ inputs.cerita }}
          path: hasil/
          if-no-files-found: warn
          retention-days: 14
