name: Uji runtime visual NewMotion (manual)

# Workflow ini dipertahankan untuk pemeriksaan mendalam saat diminta.
# Render otomatis adegan motor-jembatan dijalankan oleh render-adegan-uji-visual.yml
# agar satu perubahan tidak memicu dua render video yang sama.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-nuh2-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil kode NewMotion
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Pasang FFmpeg, font, dan OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-ind

      - name: Pasang runtime NewMotion dan dependensi render
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[render]'
          python -m playwright install --with-deps chromium

      - name: Periksa renderer dan input adegan uji
        run: |
          test -f mesin-video/papan_buat.py
          test -f mesin-video/papan/cerita.js
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("tests/data/adegan_uji_visual.json")
          spec = json.loads(path.read_text(encoding="utf-8"))
          print(f"Spesifikasi adegan uji: {path}")
          print(f"Jumlah shot: {len(spec.get('cerita', {}).get('shot', []))}")
          PY

      - name: Periksa runtime NewMotion
        run: |
          newmotion --version
          newmotion doctor

      - name: Render dan verifikasi adegan uji
        run: |
          mkdir -p hasil
          set -o pipefail
          newmotion render tests/data/adegan_uji_visual.json -o adegan-uji-visual.mp4 2>&1 | tee hasil/render-adegan-uji.log
          test -s hasil/adegan-uji-visual.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height,r_frame_rate -of json hasil/adegan-uji-visual.mp4 > hasil/metadata-adegan-uji.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("hasil/metadata-adegan-uji.json").read_text())
          streams = metadata.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
          if video is None or audio is None:
              raise SystemExit("Stream video atau audio adegan uji tidak ditemukan.")
          if video.get("codec_name") != "h264" or audio.get("codec_name") != "aac":
              raise SystemExit("Codec video/audio tidak sesuai kontrak.")
          durasi = float(metadata.get("format", {}).get("duration", 0))
          if not 35 <= durasi <= 45:
              raise SystemExit(f"Durasi di luar rentang 35–45 detik: {durasi:.2f}")
          print(f"LOLOS: H.264 + AAC, durasi {durasi:.2f} detik.")
          PY

      - name: Simpan artefak pengujian
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-uji-adegan-visual-newmotion-runtime
          path: hasil/
          if-no-files-found: warn
          retention-days: 14
