name: Uji render Yajuj2 melalui runtime NewMotion

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pembuat-karakter-gabungan
    paths:
      - 'newmotion/**'
      - 'config/**'
      - 'mesin-video/papan/**'
      - 'mesin-video/papan_buat.py'
      - 'pyproject.toml'
      - '.github/workflows/render-yajuj2-runtime.yml'

permissions:
  contents: read

jobs:
  render-yajuj2-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Pasang FFmpeg dan font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Pasang runtime, dependensi render, dan Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[render]'
          python -m playwright install --with-deps chromium

      - name: Periksa runtime
        run: |
          newmotion --version
          newmotion doctor

      - name: Render JSON asli melalui runtime NewMotion
        run: |
          mkdir -p hasil
          newmotion render mesin-video/papan/kisah/yajuj2.json -o yajuj2-runtime.mp4 2>&1 | tee hasil/render-runtime.log

      - name: Validasi dan catat metadata MP4
        if: always()
        run: |
          if [ -f hasil/yajuj2-runtime.mp4 ]; then
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json hasil/yajuj2-runtime.mp4 | tee hasil/metadata-runtime.json
            sha256sum hasil/yajuj2-runtime.mp4 | tee hasil/SHA256-runtime.txt
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 hasil/yajuj2-runtime.mp4)" = "h264"
          else
            echo "MP4 tidak dihasilkan oleh runtime NewMotion." | tee hasil/validasi-gagal.txt
            exit 1
          fi

      - name: Simpan artefak runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yajuj2-runtime-newmotion
          path: hasil/
          if-no-files-found: warn
          retention-days: 14
