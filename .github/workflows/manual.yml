name: Jalur manual — render papan JSON tanpa LLM

on:
  workflow_dispatch:
    inputs:
      spek:
        description: "Jalur papan di repo, mis. mesin-video/papan/kisah/mahsyar1.json atau antrean/<id>/papan_manual.json"
        required: true
        type: string
      mode:
        description: "Pratinjau visual tanpa TTS atau render final dengan TTS"
        required: true
        type: choice
        options:
          - pratinjau
          - final
        default: pratinjau
      kirim:
        description: "Kirim hasil final ke Telegram (diabaikan pada mode pratinjau)"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: manual-${{ inputs.spek }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang renderer
        run: |
          python -m pip install -e '.[render]'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core
      - name: Cache dataset hadis (penjaga dalil memverifikasi kartu hadis)
        uses: actions/cache@v4
        with:
          path: data/hadis
          key: hadis-${{ hashFiles('newmotion/paket_genre/kisah_islami/dalil/unduh_hadis.py') }}
      - name: Unduh dataset hadis bila cache belum ada
        run: test -f data/hadis/bukhari.json.gz || python -m newmotion.paket_genre.kisah_islami.dalil.unduh_hadis
      - name: Render dan periksa
        env:
          SPEK: ${{ inputs.spek }}
          KIRIM: ${{ inputs.kirim }}
          MODE: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          QURAN_FOUNDATION_CLIENT_ID: ${{ secrets.QURAN_FOUNDATION_CLIENT_ID }}
          QURAN_FOUNDATION_CLIENT_SECRET: ${{ secrets.QURAN_FOUNDATION_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasil
          tambahan=()
          if [[ "$MODE" == "pratinjau" ]]; then
            tambahan+=(--pratinjau-visual)
          else
            [[ "$KIRIM" == "true" ]] && tambahan+=(--kirim)
          fi
          python -m newmotion.application.jalur_manual "$SPEK" -o hasil/video.mp4 "${tambahan[@]}"
      - name: Simpan narasi buatan (supaya kredit ElevenLabs tidak terpakai lagi)
        if: always() && inputs.mode == 'final'
        env:
          SPEK: ${{ inputs.spek }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SPEK" == antrean/* ]]; then a="$(dirname "$SPEK")/audio"; else a="mesin-video/audio_manual/$(basename "$SPEK" .json)_auto"; fi
          c="$(dirname "$SPEK")/ciri.json"
          [[ -d "$a" || -f "$c" ]] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          if [[ -d "$a" ]]; then git add "$a"; fi
          if [[ "$SPEK" == antrean/* && -f "$c" ]]; then git add "$c"; fi
          git diff --cached --quiet && exit 0
          git commit -m "Jalur manual: narasi $SPEK"
          # simpan ke branch tempat workflow dijalankan (main dari bot; branch video/* dari AI berakses GitHub)
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
      - name: Simpan artefak
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jalur-manual
          path: hasil/
          retention-days: 7
