name: Audit PR #28 — Pratinjau Semantik Kisah

on:
  # Sengaja manual: render visual tidak boleh dipicu oleh push atau pull request.
  workflow_dispatch:
    inputs:
      cerita:
        description: "Pilih cerita untuk pratinjau pengarahan PR #28"
        required: true
        type: choice
        default: yajuj1
        options:
          - yajuj1
          - doa2
          - bangkrut1
          - wali1

permissions:
  contents: read

jobs:
  pratinjau-semantik:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ambil kode PR
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pasang FFmpeg dan font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Pasang runtime dan dependensi render
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[render]'
          python -m playwright install --with-deps chromium

      - name: Render naskah melalui Sutradara NewMotion
        env:
          CERITA: ${{ inputs.cerita }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CERITA" in
            yajuj1) SUMBER="tests/data/tolok_ukur/yajuj1.json" ;;
            doa2|bangkrut1|wali1) SUMBER="tests/data/tolok_ukur_buta/$CERITA.json" ;;
            *) echo "::error::Pilihan cerita tidak dikenal"; exit 1 ;;
          esac
          test -s "$SUMBER"
          mkdir -p hasil-pr28
          newmotion render "$SUMBER" \
            --naskah --genre kisah_islami --tanpa-suara \
            -o "$GITHUB_WORKSPACE/hasil-pr28/$CERITA.mp4"

      - name: Audit spesifikasi hasil pengarahan
        env:
          CERITA: ${{ inputs.cerita }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          nama = os.environ["CERITA"]
          papan = Path("hasil-pr28") / f"{nama}.papan.json"
          if not papan.is_file():
              raise SystemExit(f"Papan hasil pengarahan tidak ditemukan: {papan}")
          spec = json.loads(papan.read_text(encoding="utf-8"))
          shots = spec.get("cerita", {}).get("shot", [])
          if not shots:
              raise SystemExit("Direktur tidak menghasilkan shot.")

          jenis = {
              b.get("jenis")
              for shot in shots
              for b in shot.get("benda", [])
              if isinstance(b, dict)
          }
          print(f"Cerita: {nama}; jumlah shot: {len(shots)}")
          print("Jenis benda:", ", ".join(sorted(jenis)))

          if nama == "yajuj1":
              wajib = {"ngarai", "penggali", "pemimpin"}
              hilang = wajib - jenis
              if hilang:
                  raise SystemExit(f"Subjek penting tidak diarahkan: {sorted(hilang)}")

              # Kata air generik tidak boleh menjadi kerumunan berlari.
              # Kerumunan tetap sah bila narasi secara eksplisit menyebut manusia berlarian.
              for nomor, shot in enumerate(shots):
                  narasi = str(shot.get("_narasi", "")).lower()
                  objek = {
                      b.get("jenis") for b in shot.get("benda", []) if isinstance(b, dict)
                  }
                  if "air" in narasi and not any(
                      kata in narasi for kata in ("berlari", "berlarian", "menyerbu")
                  ) and "arus" in objek:
                      raise SystemExit(
                          f"shot {nomor}: air generik salah dipetakan menjadi arus"
                      )
                  if any(kata in narasi for kata in ("kubur", "makam")):
                      if {"ngarai", "penggali"} & objek:
                          raise SystemExit(
                              f"shot {nomor}: konteks kubur memakai renderer dinding/penggali"
                          )
          PY

      - name: Verifikasi MP4 dan ambil frame audit
        env:
          CERITA: ${{ inputs.cerita }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          video = Path("hasil-pr28") / f"{os.environ['CERITA']}.mp4"
          if not video.is_file() or video.stat().st_size == 0:
              raise SystemExit("MP4 tidak terbentuk.")
          hasil = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "format=duration,size:stream=codec_name,width,height",
               "-of", "json", str(video)],
              check=True, capture_output=True, text=True,
          )
          metadata = json.loads(hasil.stdout)
          (video.parent / "metadata.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )
          stream = next(
              (s for s in metadata.get("streams", []) if s.get("codec_name") == "h264"),
              None,
          )
          if stream is None or (stream.get("width"), stream.get("height")) != (1080, 1920):
              raise SystemExit("Video bukan H.264 vertikal 1080x1920.")
          durasi = float(metadata["format"]["duration"])
          for detik in (0.5, 2, 4, 6, 8, 10, 12, 15, 20):
              if detik >= durasi:
                  continue
              frame = video.parent / f"frame-{detik:g}.png"
              subprocess.run(
                  ["ffmpeg", "-y", "-loglevel", "error", "-ss", str(detik),
                   "-i", str(video), "-frames:v", "1", str(frame)],
                  check=True,
              )
          with (video.parent / "SHA256SUMS.txt").open("w") as berkas:
              subprocess.run(["sha256sum", str(video)], check=True,
                             stdout=berkas)
          print(f"LOLOS: H.264 1080x1920, durasi {durasi:.2f} detik.")
          PY

      - name: Simpan MP4, papan, metadata, dan frame audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr28-pratinjau-semantik-${{ inputs.cerita }}
          path: hasil-pr28/
          if-no-files-found: warn
          retention-days: 14
