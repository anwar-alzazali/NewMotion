name: Uji renderer lengkap (manual)

# Pemeriksaan seluruh katalog benda dan anatomi tokoh. Tidak memanggil LLM, TTS, atau API berbayar.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pasang renderer dan Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -e '.[uji,render]'
          python -m playwright install --with-deps chromium
      - name: Reproduksi baseline timeline shot dan audio
        run: |
          set -euo pipefail
          mkdir -p hasil/timeline
          # Kasus A: satu-satunya shot lanjutan dimulai pada detik 12.
          python mesin-video/papan_buat.py tests/data/renderer_timeline_shot_terlambat.json \
            -o hasil/timeline/shot_terlambat_pratinjau --pratinjau 12
          python mesin-video/papan_buat.py tests/data/renderer_timeline_shot_terlambat.json \
            -o hasil/timeline/shot_terlambat.mp4 --tanpa-suara
          # Kasus B: durasi video 5 detik, tetapi SFX dan rekaman dijadwalkan pada detik 7.
          ffmpeg -y -loglevel error -f lavfi -i sine=frequency=440:duration=2 \
            -c:a pcm_s16le hasil/timeline/cue.wav
          python mesin-video/papan_buat.py tests/data/renderer_timeline_audio_terlambat.json \
            -o hasil/timeline/audio_terlambat.mp4
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          dasar = Path("hasil/timeline")
          def durasi(path):
              nilai = subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration",
                  "-of", "csv=p=0", str(path)
              ], text=True).strip()
              return float(nilai)

          shot = durasi(dasar / "shot_terlambat.mp4")
          audio = durasi(dasar / "audio_terlambat.mp4")
          sfx = json.loads((dasar / "audio_terlambat.sfx.json").read_text(encoding="utf-8"))
          gambar = dasar / "shot_terlambat_pratinjau_12.0.png"
          assert gambar.is_file(), "Pratinjau shot pada detik 12 tidak dibuat"
          assert abs(shot - 3.2) <= 0.15, f"Perilaku baseline shot berubah: {shot:.3f} dtk"
          assert abs(audio - 5.0) <= 0.15, f"Durasi eksplisit 5 dtk berubah: {audio:.3f} dtk"
          assert any(abs(float(x[0]) - 7.0) < 0.01 for x in sfx), "Cue SFX detik 7 tidak tercatat"
          laporan = [
              "# Reproduksi baseline timeline RND-001",
              "",
              "- Kasus A: shot terakhir dimulai pada detik 12, tetapi MP4 hanya "
              f"**{shot:.3f} detik** (durasi turunan saat ini sekitar 3,2 detik).",
              "- Pratinjau manual pada detik 12: tersedia; ini bukan bukti bahwa shot masuk ke MP4.",
              "- Kasus B: durasi eksplisit MP4 **"
              f"{audio:.3f} detik**; SFX tercatat pada detik 7 dan rekaman eksternal juga dijadwalkan pada detik 7.",
              "- Cue setelah batas video tidak memperpanjang durasi hasil; mixer memotong hasil ke durasi target.",
              "",
              "Hasil ini mereproduksi perilaku lama untuk diagnosis; bukan kriteria lulus kualitas produksi."
          ]
          isi = "\n".join(laporan) + "\n"
          (dasar / "baseline_timeline.md").write_text(isi, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(isi)
          print(isi)
          PY
      - name: Ukur seluruh benda
        run: python mesin-video/papan/ukur_benda.py
      - name: Uji tokoh lapis A
        run: python mesin-video/papan/uji_tokoh.py -o hasil/uji_tokoh
      - name: Buat lembar semua benda (dua keadaan)
        run: python mesin-video/papan/lembar_semua_benda.py
      - name: Ringkasan jumlah benda, ukuran, dan temuan Lapis A
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          from newmotion.application.katalog_renderer import katalog

          hasil = Path("hasil")
          ukuran_path = Path("newmotion/application/data/ukuran_benda.json")
          ukuran = json.loads(ukuran_path.read_text(encoding="utf-8")) if ukuran_path.is_file() else {}
          nama_benda = set(katalog())
          tanpa_ukuran = sorted(nama_benda - set(ukuran))
          laporan_path = hasil / "uji_tokoh" / "laporan.json"
          laporan = json.loads(laporan_path.read_text(encoding="utf-8")) if laporan_path.is_file() else {}
          temuan = laporan.get("temuan") if isinstance(laporan, dict) else None
          temuan = temuan if isinstance(temuan, list) else []
          manifest_path = hasil / "manifest-renderer.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.is_file() else {}
          benda = manifest.get("benda", [])
          animasi = sum(bool(x.get("parameter_animasi")) for x in benda)
          galat_js = manifest.get("galat_javascript", [])
          from collections import Counter
          hitung = Counter(x.get("kode", "TANPA_KODE") for x in temuan)
          baris = [
              "# Ringkasan uji renderer",
              "",
              f"- Jumlah benda katalog: **{len(nama_benda)}**",
              f"- Benda dengan parameter animasi: **{animasi}**",
              f"- Benda tanpa ukuran: **{len(tanpa_ukuran)}**",
              f"- Temuan Lapis A: **{len(temuan)}**",
              f"- Galat JavaScript: **{len(galat_js)}**",
              "",
          ]
          if tanpa_ukuran:
              baris += ["## Benda tanpa ukuran", *[f"- {x}" for x in tanpa_ukuran], ""]
          if hitung:
              baris += ["## Temuan Lapis A", *[f"- {k}: {v}" for k, v in sorted(hitung.items())], ""]
          if galat_js:
              baris += ["## Galat JavaScript", *[f"- {x}" for x in galat_js], ""]
          if not tanpa_ukuran and not temuan and not galat_js:
              baris.append("Semua benda terukur, Lapis A tanpa temuan, dan tidak ada galat JavaScript.")
          ringkasan = "\n".join(baris) + "\n"
          (hasil / "ringkasan.md").write_text(ringkasan, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(ringkasan)
          if not laporan_path.is_file() or not manifest_path.is_file():
              print("::error::Laporan uji tokoh atau manifest renderer tidak tersedia")
              sys.exit(1)
          if tanpa_ukuran or temuan or galat_js:
              print("::error::Uji renderer menemukan ukuran hilang, temuan Lapis A, atau galat JavaScript")
              sys.exit(1)
          PY
      - name: Simpan hasil ke branch baru
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasil
          if [[ -f newmotion/application/data/ukuran_benda.json ]]; then
            cp newmotion/application/data/ukuran_benda.json hasil/ukuran_benda.json
          fi
          if [[ -f hasil/ringkasan.md ]]; then
            cat hasil/ringkasan.md
          fi
          cd hasil
          rm -rf .git
          git init -q
          git checkout -q -b hasil
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -f .
          if git diff --cached --quiet; then
            echo "Tidak ada berkas hasil untuk disimpan."
            exit 0
          fi
          git commit -q -m "Hasil uji renderer run $RUN"
          git push -q "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/hasil/renderer-${RUN}"
          rm -rf .git
          echo "Hasil tersimpan di branch hasil/renderer-${RUN}." >> "$GITHUB_STEP_SUMMARY"
      - name: Kirim hasil percobaan ke Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID wajib diatur agar hasil percobaan terkirim."
            exit 1
          fi
          mkdir -p hasil
          if [[ ! -f hasil/ringkasan.md ]]; then
            printf '# Uji renderer\n\nPercobaan berhenti sebelum ringkasan dibuat. Periksa log GitHub Actions.\n' > hasil/ringkasan.md
          fi
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          sumber = Path("hasil")
          with ZipFile("hasil-renderer.zip", "w", ZIP_DEFLATED) as arsip:
              for berkas in sumber.rglob("*"):
                  if berkas.is_file():
                      arsip.write(berkas, berkas.relative_to(sumber))
          PY
          curl --fail --silent --show-error \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "text=Hasil percobaan renderer #${RUN_ID}\nStatus workflow: ${{ job.status }}\nLog: ${RUN_URL}\n\n$(cat hasil/ringkasan.md | head -c 3000)" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null
          curl --fail --silent --show-error \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "caption=Paket hasil renderer #${RUN_ID} (visual, JSON, dan laporan)" \
            --form "document=@hasil-renderer.zip" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" >/dev/null
      - name: Unggah artefak cadangan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-renderer-${{ github.run_id }}
          path: hasil/
          if-no-files-found: warn
          retention-days: 30
