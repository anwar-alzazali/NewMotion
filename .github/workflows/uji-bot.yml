name: Uji bot Telegram NewMotion

on:
  pull_request:
    paths:
      - 'bot/**'
      - 'newmotion/application/antrean_naskah.py'
      - 'newmotion/paket_genre/kisah_islami/dalil/**'
      - 'tests/test_antrean_naskah.py'
      - 'tests/data/kartu_status.json'
      - '.github/workflows/uji-bot.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'bot/**'
      - 'newmotion/application/antrean_naskah.py'
      - 'newmotion/paket_genre/kisah_islami/dalil/**'
      - 'tests/test_antrean_naskah.py'
      - 'tests/data/kartu_status.json'
      - '.github/workflows/uji-bot.yml'

permissions:
  contents: read

jobs:
  uji-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Uji worker Telegram
        run: node --test bot/worker.test.mjs
      - name: Pasang NewMotion
        run: python -m pip install -e '.[uji]'
      - name: Uji antrean naskah
        run: python -m pytest tests/test_antrean_naskah.py -q
