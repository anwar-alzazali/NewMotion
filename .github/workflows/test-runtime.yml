name: Uji runtime NewMotion

on:
  pull_request:
    paths:
      - 'newmotion/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-runtime.yml'
  push:
    branches:
      - 'feature/pembuat-karakter-gabungan'
    paths:
      - 'newmotion/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-runtime.yml'

jobs:
  uji-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pastikan FFmpeg tersedia untuk doctor
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Pasang paket dan alat uji
        run: python -m pip install -e '.[uji]'
      - name: Periksa sintaks Python
        run: python -m compileall -q newmotion tests
      - name: Uji runtime
        run: python -m pytest
      - name: Uji bot
        run: |
          cd bot
          npm install
          node --test
      - name: Bandingkan skor sebelum dan sesudah untuk tolok ukur dan holdout
        run: |
          git fetch origin main
          mkdir -p /tmp/newmotion-baseline
          git archive origin/main | tar -x -C /tmp/newmotion-baseline
          mkdir -p /tmp/newmotion-baseline/tests/data/tolok_ukur_tambahan
          cp tests/laporan_ukur_perbandingan.py /tmp/newmotion-baseline/tests/
          cp tests/data/tolok_ukur_tambahan/*.json /tmp/newmotion-baseline/tests/data/tolok_ukur_tambahan/
          echo "=== BASELINE MAIN: 4 TOLok UKUR ==="
          (cd /tmp/newmotion-baseline && PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur)
          echo "=== BASELINE MAIN: 3 HOLDOUT ==="
          (cd /tmp/newmotion-baseline && PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur_tambahan)
          echo "=== BRANCH PR: 4 TOLok UKUR ==="
          PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur
          echo "=== BRANCH PR: 3 HOLDOUT ==="
          PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur_tambahan
      - name: Ukur kedalaman papan hasil pengarah
        run: newmotion ukur
      - name: Periksa CLI
        run: |
          newmotion --version
          newmotion doctor
