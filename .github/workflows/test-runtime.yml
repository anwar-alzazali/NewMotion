name: Uji runtime NewMotion

on:
  pull_request:
    paths:
      - 'newmotion/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-runtime.yml'
  push:
    branches:
      - 'feature/pembuat-karakter-gabungan'
    paths:
      - 'newmotion/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-runtime.yml'

jobs:
  uji-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang FFmpeg untuk doctor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Pasang paket dan alat uji
        run: python -m pip install -e '.[uji]'
      - name: Periksa sintaks Python
        run: python -m compileall -q newmotion tests
      - name: Uji runtime
        run: python -m pytest
      - name: Periksa CLI
        run: |
          newmotion --version
          newmotion doctor
