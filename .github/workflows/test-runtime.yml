name: Uji runtime NewMotion

on:
  pull_request:
    paths:
      - 'newmotion/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-runtime.yml'
  push:
    branches:
      - 'feature/pembuat-karakter-gabungan'
    paths:
      - 'newmotion/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-runtime.yml'

jobs:
  uji-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pastikan FFmpeg tersedia untuk doctor
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Pasang paket dan alat uji
        run: python -m pip install -e '.[uji]'
      - name: Periksa sintaks Python
        run: python -m compileall -q newmotion tests
      - name: Uji runtime
        run: python -m pytest
      - name: Uji bot
        run: |
          cd bot
          npm install
          node --test
      - name: Bandingkan skor dengan alat ukur PR #29 (tanpa mengubah file alat ukur PR #28)
        run: |
          git fetch origin main
          git fetch origin perbaikan/leksikon-arus
          git show FETCH_HEAD:newmotion/application/ukur_kedalaman.py > /tmp/ukur_kedalaman_pr29.py
          mkdir -p /tmp/newmotion-baseline
          git archive origin/main | tar -x -C /tmp/newmotion-baseline
          mkdir -p /tmp/newmotion-baseline/tests/data/tolok_ukur_tambahan
          cp tests/laporan_ukur_perbandingan.py /tmp/newmotion-baseline/tests/
          cp tests/data/tolok_ukur_tambahan/*.json /tmp/newmotion-baseline/tests/data/tolok_ukur_tambahan/
          cp /tmp/ukur_kedalaman_pr29.py /tmp/newmotion-baseline/newmotion/application/ukur_kedalaman.py
          cp newmotion/application/ukur_kedalaman.py /tmp/ukur_kedalaman_pr28.py
          cp /tmp/ukur_kedalaman_pr29.py newmotion/application/ukur_kedalaman.py
          echo "=== BASELINE MAIN + ALAT UKUR PR #29: 4 TOLok UKUR ==="
          (cd /tmp/newmotion-baseline && PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur)
          echo "=== BASELINE MAIN + ALAT UKUR PR #29: HOLDOUT TERDAFTAR ==="
          (cd /tmp/newmotion-baseline && PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur_tambahan)
          echo "=== BRANCH PR #28 + ALAT UKUR PR #29: 4 TOLok UKUR ==="
          PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur
          echo "=== BRANCH PR #28 + ALAT UKUR PR #29: SEMUA HOLDOUT ==="
          PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur_tambahan
          cp /tmp/ukur_kedalaman_pr28.py newmotion/application/ukur_kedalaman.py
      - name: Uji CLI ukur asli PR #28 (alat ukur tidak dimodifikasi)
        run: newmotion ukur
      - name: Periksa CLI
        run: |
          newmotion --version
          newmotion doctor
