name: Uji runtime NewMotion

on:
  pull_request:
    paths:
      - 'newmotion/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-runtime.yml'
  push:
    branches:
      - 'feature/pembuat-karakter-gabungan'
      - 'tugas-1-llm-naskah'
      - 'tugas-*'
    paths:
      - 'newmotion/**'
      - 'config/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-runtime.yml'

permissions:
  contents: write

jobs:
  uji-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pastikan FFmpeg tersedia untuk doctor
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Pasang paket dan alat uji
        run: python -m pip install -e '.[uji]'
      - name: Periksa sintaks Python
        run: python -m compileall -q newmotion tests
      - name: Pasang renderer untuk ukur dan bukti visual
        run: |
          python -m pip install -e '.[render]'
          python -m playwright install --with-deps chromium
      - name: Periksa sintaks JavaScript renderer
        run: node --check mesin-video/papan/cerita.js
      - name: Ukur semua benda dan buat lembar dua keadaan
        run: |
          python mesin-video/papan/ukur_benda.py
          python mesin-video/papan/lembar_benda_baru.py
      - name: Simpan hasil pengukuran bbox ke cabang tugas
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add newmotion/application/data/ukuran_benda.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tugas 3: simpan ukuran benda hasil renderer"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Periksa Ruff pada berkas Python yang berubah
        run: |
          python -m pip install ruff==0.14.10
          ruff check newmotion/application/kebutuhan_renderer.py newmotion/paket_genre/kisah_islami/rencana_sutradara.py newmotion/paket_genre/kisah_islami/sutradara_llm.py newmotion/paket_genre/kisah_islami/sutradara_hibrida.py newmotion/paket_genre/kisah_islami/periksa_visual.py tests/test_kebutuhan_renderer.py tests/test_pustaka_benda.py mesin-video/papan/lembar_benda_baru.py
      - name: Uji runtime
        run: python -m pytest
      - name: Unggah bukti visual pustaka benda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-pustaka-benda-baru
          path: |
            hasil/pustaka-benda-baru.png
            newmotion/application/data/ukuran_benda.json
          if-no-files-found: warn
          retention-days: 14
      - name: Uji bot
        run: |
          cd bot
          npm install
          node --test
      - name: Bandingkan skor dengan alat ukur PR #29 (tanpa mengubah file alat ukur PR #28)
        run: |
          git fetch origin main
          git fetch origin perbaikan/leksikon-arus
          git show FETCH_HEAD:newmotion/application/ukur_kedalaman.py > /tmp/ukur_kedalaman_pr29.py
          mkdir -p /tmp/newmotion-baseline
          git archive origin/main | tar -x -C /tmp/newmotion-baseline
          mkdir -p /tmp/newmotion-baseline/tests/data/tolok_ukur_tambahan
          mkdir -p /tmp/newmotion-baseline/tests/data/tolok_ukur_buta
          cp tests/laporan_ukur_perbandingan.py /tmp/newmotion-baseline/tests/
          cp tests/data/tolok_ukur_tambahan/*.json /tmp/newmotion-baseline/tests/data/tolok_ukur_tambahan/
          cp tests/data/tolok_ukur_buta/*.json /tmp/newmotion-baseline/tests/data/tolok_ukur_buta/
          cp /tmp/ukur_kedalaman_pr29.py /tmp/newmotion-baseline/newmotion/application/ukur_kedalaman.py
          cp newmotion/application/ukur_kedalaman.py /tmp/ukur_kedalaman_pr28.py
          cp /tmp/ukur_kedalaman_pr29.py newmotion/application/ukur_kedalaman.py
          echo "=== BASELINE MAIN + ALAT UKUR PR #29: 4 TOLok UKUR ==="
          (cd /tmp/newmotion-baseline && PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur)
          echo "=== BASELINE MAIN + ALAT UKUR PR #29: HOLDOUT TERDAFTAR ==="
          (cd /tmp/newmotion-baseline && PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur_tambahan)
          echo "=== BRANCH PR #28 + ALAT UKUR PR #29: 4 TOLok UKUR ==="
          PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur
          echo "=== BRANCH PR #28 + ALAT UKUR PR #29: HOLDOUT LAMA (SUDAH TERLIHAT) ==="
          PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur_tambahan
          echo "=== BASELINE MAIN + ALAT UKUR PR #29: BLIND HOLDOUT TERDAFTAR ==="
          (cd /tmp/newmotion-baseline && PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur_buta)
          echo "=== BRANCH PR #28 + ALAT UKUR PR #29: BLIND HOLDOUT TERDAFTAR ==="
          PYTHONPATH=. python tests/laporan_ukur_perbandingan.py --folder tests/data/tolok_ukur_buta
          cp /tmp/ukur_kedalaman_pr28.py newmotion/application/ukur_kedalaman.py
      - name: Uji CLI ukur asli PR #28 (alat ukur tidak dimodifikasi)
        run: newmotion ukur
      - name: Periksa CLI
        run: |
          newmotion --version
          newmotion doctor
