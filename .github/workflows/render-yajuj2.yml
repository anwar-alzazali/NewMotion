name: Render ulang Yajuj2

on:
  push:
    branches:
      - clone/mesin-video-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-yajuj2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang FFmpeg dan font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Pasang dependensi Python dan Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy playwright
          python -m playwright install --with-deps chromium

      - name: Render Yajuj2 dengan TTS dan efek asli
        run: |
          mkdir -p hasil
          python mesin-video/papan_buat.py mesin-video/papan/kisah/yajuj2.json -o hasil/yajuj2.mp4

      - name: Catat metadata hasil
        if: always()
        run: |
          if [ -f hasil/yajuj2.mp4 ]; then
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json hasil/yajuj2.mp4 | tee hasil/metadata.json
            sha256sum hasil/yajuj2.mp4 | tee hasil/SHA256SUMS.txt
          fi

      - name: Simpan hasil render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yajuj2-newmotion
          path: hasil/
          if-no-files-found: warn
          retention-days: 14
